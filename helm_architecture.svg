<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" width="1200" height="950">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B1F"/>
      <stop offset="100%" stop-color="#22262C"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D333B"/>
      <stop offset="100%" stop-color="#24292F"/>
    </linearGradient>

    <linearGradient id="cardGradCoral" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#342825"/>
      <stop offset="100%" stop-color="#24292F"/>
    </linearGradient>

    <linearGradient id="cardGradTeal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#203336"/>
      <stop offset="100%" stop-color="#24292F"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="glowTeal" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#76ABAE" flood-opacity="0.5"/>
    </filter>

    <filter id="glowCoral" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FF5722" flood-opacity="0.5"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#76ABAE"/>
    </marker>
    <marker id="arrowCoral" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FF5722"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B949E"/>
    </marker>
  </defs>

  <style>
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #FFFFFF; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #9EABB8; }
    .label-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #76ABAE; }
    .system-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 800; fill: #FFFFFF; letter-spacing: -0.5px; }
    .system-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #76ABAE; letter-spacing: 0.5px; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="950" fill="url(#bgGrad)"/>

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.07">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200 M0 350 H1200 M0 400 H1200 M0 450 H1200 M0 500 H1200 M0 550 H1200 M0 600 H1200 M0 650 H1200 M0 700 H1200 M0 750 H1200 M0 800 H1200 M0 850 H1200 M0 900 H1200" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M50 0 V950 M100 0 V950 M150 0 V950 M200 0 V950 M250 0 V950 M300 0 V950 M350 0 V950 M400 0 V950 M450 0 V950 M500 0 V950 M550 0 V950 M600 0 V950 M650 0 V950 M700 0 V950 M750 0 V950 M800 0 V950 M850 0 V950 M900 0 V950 M950 0 V950 M1000 0 V950 M1050 0 V950 M1100 0 V950 M1150 0 V950" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Header Banner -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="38" height="38" rx="8" fill="#FF5722"/>
    <text x="19" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">H</text>
    <text x="50" y="22" class="system-header">HELM — Multi-Agent Architecture Topology</text>
    <text x="50" y="38" class="system-sub">CLOUD-NATIVE AGENT STEERING • LANGGRAPH • MCP • SCALE-TO-ZERO SERVERLESS</text>
  </g>

  <!-- ================= CONNECTORS / ARROWS ================= -->

  <!-- Node 1 -> Node 2 -->
  <line x1="600" y1="165" x2="600" y2="215" stroke="#76ABAE" stroke-width="2.5" marker-end="url(#arrowTeal)"/>

  <!-- Badge on Connector 1 -->
  <g transform="translate(600, 190)">
    <rect x="-140" y="-13" width="280" height="26" rx="13" fill="#181B1F" stroke="#76ABAE" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="0" y="4" class="label-badge" text-anchor="middle">HTTPS / REST + 3-Retry Backoff</text>
  </g>

  <!-- Node 2 -> Node 3 -->
  <line x1="600" y1="285" x2="600" y2="330" stroke="#76ABAE" stroke-width="2.5" marker-end="url(#arrowTeal)"/>

  <!-- Node 3 -> Worker Branching -->
  <!-- Split bar -->
  <path d="M600 400 V435 H360 V465" stroke="#76ABAE" stroke-width="2" fill="none" marker-end="url(#arrowTeal)"/>
  <path d="M600 400 V435 H840 V465" stroke="#FF5722" stroke-width="2" fill="none" marker-end="url(#arrowCoral)"/>

  <!-- Workers -> MCP Reconvergence -->
  <path d="M360 535 V570 H600 V600" stroke="#76ABAE" stroke-width="2" fill="none" marker-end="url(#arrowTeal)"/>
  <path d="M840 535 V570 H600" stroke="#FF5722" stroke-width="2" fill="none"/>

  <!-- MCP -> Bottom Services Split -->
  <path d="M600 670 V710 H360 V745" stroke="#76ABAE" stroke-width="2" fill="none" marker-end="url(#arrowTeal)"/>
  <path d="M600 670 V710 H840 V745" stroke="#FF5722" stroke-width="2" fill="none" marker-end="url(#arrowCoral)"/>


  <!-- ================= CARDS / NODES ================= -->

  <!-- NODE 1: Angular 19 Standalone SPA -->
  <g transform="translate(360, 95)" filter="url(#shadow)">
    <rect width="480" height="70" rx="10" fill="url(#cardGrad)" stroke="#76ABAE" stroke-width="1.8"/>
    <circle cx="28" cy="35" r="14" fill="#76ABAE" opacity="0.2"/>
    <text x="28" y="40" font-family="sans-serif" font-size="14" text-anchor="middle">🌐</text>
    <text x="56" y="32" class="title-text">Angular 19 Standalone SPA</text>
    <text x="56" y="52" class="subtitle-text">(Vercel Edge • Signals • Reactive UI)</text>
  </g>

  <!-- NODE 2: FastAPI Stateless Backend -->
  <g transform="translate(360, 215)" filter="url(#shadow)">
    <rect width="480" height="70" rx="10" fill="url(#cardGrad)" stroke="#76ABAE" stroke-width="1.8"/>
    <circle cx="28" cy="35" r="14" fill="#76ABAE" opacity="0.2"/>
    <text x="28" y="40" font-family="sans-serif" font-size="14" text-anchor="middle">⚡</text>
    <text x="56" y="32" class="title-text">FastAPI Stateless Backend</text>
    <text x="56" y="52" class="subtitle-text">(Render.com Container Runtime)</text>
  </g>

  <!-- NODE 3: LangGraph Orchestration (Supervisor Router) -->
  <g transform="translate(360, 330)" filter="url(#shadow)">
    <rect width="480" height="70" rx="10" fill="url(#cardGrad)" stroke="#76ABAE" stroke-width="2" filter="url(#glowTeal)"/>
    <circle cx="28" cy="35" r="14" fill="#76ABAE" opacity="0.25"/>
    <text x="28" y="40" font-family="sans-serif" font-size="14" text-anchor="middle">🧭</text>
    <text x="56" y="32" class="title-text">LangGraph Orchestration</text>
    <text x="56" y="52" class="subtitle-text">(Supervisor Router)</text>
  </g>

  <!-- WORKER 1: Researcher Worker -->
  <g transform="translate(140, 465)" filter="url(#shadow)">
    <rect width="440" height="70" rx="10" fill="url(#cardGradTeal)" stroke="#76ABAE" stroke-width="1.8"/>
    <circle cx="28" cy="35" r="14" fill="#76ABAE" opacity="0.25"/>
    <text x="28" y="40" font-family="sans-serif" font-size="14" text-anchor="middle">🔬</text>
    <text x="56" y="32" class="title-text">Researcher Worker</text>
    <text x="56" y="52" class="subtitle-text">(Domain Notes &amp; Trade-offs)</text>
  </g>

  <!-- WORKER 2: Coder Worker -->
  <g transform="translate(620, 465)" filter="url(#shadow)">
    <rect width="440" height="70" rx="10" fill="url(#cardGradCoral)" stroke="#FF5722" stroke-width="1.8"/>
    <circle cx="28" cy="35" r="14" fill="#FF5722" opacity="0.25"/>
    <text x="28" y="40" font-family="sans-serif" font-size="14" text-anchor="middle">💻</text>
    <text x="56" y="32" class="title-text">Coder Worker</text>
    <text x="56" y="52" class="subtitle-text">(Code Scaffolding &amp; AST Gate)</text>
  </g>

  <!-- NODE 4: MCP Tool Registry -->
  <g transform="translate(360, 600)" filter="url(#shadow)">
    <rect width="480" height="70" rx="10" fill="url(#cardGrad)" stroke="#76ABAE" stroke-width="1.8"/>
    <circle cx="28" cy="35" r="14" fill="#76ABAE" opacity="0.2"/>
    <text x="28" y="40" font-family="sans-serif" font-size="14" text-anchor="middle">🔌</text>
    <text x="56" y="32" class="title-text">MCP Tool Registry</text>
    <text x="56" y="52" class="subtitle-text">(mcp_research_query, code_inspector)</text>
  </g>

  <!-- BOTTOM LEFT: Neon Serverless PostgreSQL -->
  <g transform="translate(140, 745)" filter="url(#shadow)">
    <rect width="440" height="72" rx="10" fill="url(#cardGradTeal)" stroke="#76ABAE" stroke-width="1.8"/>
    <circle cx="28" cy="36" r="14" fill="#76ABAE" opacity="0.25"/>
    <text x="28" y="41" font-family="sans-serif" font-size="14" text-anchor="middle">🐘</text>
    <text x="56" y="33" class="title-text">Neon Serverless PostgreSQL</text>
    <text x="56" y="53" class="subtitle-text">(Checkpoints via NullPool)</text>
  </g>

  <!-- BOTTOM RIGHT: Google Gemini API -->
  <g transform="translate(620, 745)" filter="url(#shadow)">
    <rect width="440" height="72" rx="10" fill="url(#cardGradCoral)" stroke="#FF5722" stroke-width="1.8"/>
    <circle cx="28" cy="36" r="14" fill="#FF5722" opacity="0.25"/>
    <text x="28" y="41" font-family="sans-serif" font-size="14" text-anchor="middle">✨</text>
    <text x="56" y="33" class="title-text">Google Gemini API</text>
    <text x="56" y="53" class="subtitle-text">(Dynamic Models • 3 Retries)</text>
  </g>

  <!-- Footer Legend -->
  <g transform="translate(60, 895)">
    <circle cx="10" cy="10" r="5" fill="#76ABAE"/>
    <text x="22" y="14" class="subtitle-text" font-size="12">State &amp; Communication Paths</text>

    <circle cx="230" cy="10" r="5" fill="#FF5722"/>
    <text x="242" y="14" class="subtitle-text" font-size="12">Specialized Execution &amp; AI Engine</text>

    <text x="1080" y="14" class="subtitle-text" font-size="11" text-anchor="end">Production Blueprint v2.0 • Zero Idle Cloud Cost</text>
  </g>
</svg>
