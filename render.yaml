services:
  - type: web
    name: helm-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: APP_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: CORS_ORIGINS
        value: "http://localhost:4200,https://helm.vercel.app,https://*.vercel.app"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
