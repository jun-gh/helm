name: CD — Deploy Backend to Cloud Run (OIDC)

on:
  push:
    branches: [main, prodDeploy]
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'helm-backend' }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'helm' }}

jobs:
  build-and-deploy:
    name: Build (GAR + GHCR) & Deploy to Cloud Run
    runs-on: ubuntu-latest
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to Google Cloud via Workload Identity (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Log in to Google Artifact Registry (GAR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: _dcg_token
          password: ${{ steps.auth.outputs.access_token }}
        id: gar_login
        continue-on-error: true

      - name: Configure Docker for GAR via gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker for GAR
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image to GAR & GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/helm-backend:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/helm-backend:latest
            ghcr.io/${{ github.repository_owner }}/helm-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/helm-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy container to Google Cloud Run (Scale-to-Zero)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/helm-backend:${{ github.sha }}
